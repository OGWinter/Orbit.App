<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="orbit-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Outer Orbit Track -->
  <ellipse cx="20" cy="20" rx="17" ry="6.5" transform="rotate(-30 20 20)" stroke="url(#orbit-grad)" stroke-width="1.75" stroke-dasharray="1 3" opacity="0.6" />
  <!-- Inner Dynamic Orbit Ring -->
  <ellipse cx="20" cy="20" rx="14" ry="5.5" transform="rotate(35 20 20)" stroke="url(#orbit-grad)" stroke-width="2" />
  <!-- Satellite / Agent Transit Node -->
  <circle cx="31.5" cy="12" r="2.2" fill="#38bdf8" />
  <circle cx="31.5" cy="12" r="4" stroke="#38bdf8" stroke-width="0.75" opacity="0.4" />
  <!-- Second Transit Node -->
  <circle cx="8.5" cy="27" r="1.75" fill="#a855f7" />
  <!-- Core Node -->
  <circle cx="20" cy="20" r="3.75" fill="url(#orbit-core)" />
  <circle cx="20" cy="20" r="6" stroke="#6366f1" stroke-width="1" opacity="0.5" />
</svg>

